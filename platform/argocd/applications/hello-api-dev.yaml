apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: hello-api-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: hello-api

  source:
    repoURL: https://github.com/prasanakorumilli/cloud-native-ops-platform.git
    targetRevision: main
    path: charts/hello-api

    helm:
      releaseName: hello-api
      valueFiles:
        - ../../environments/dev/hello-api-values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: hello-api-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true